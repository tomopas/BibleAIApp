<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C3B2E" />
      <stop offset="55%" stop-color="#6A291F" />
      <stop offset="100%" stop-color="#3E1711" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF8B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8218" />
    </linearGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF6EE" />
      <stop offset="85%" stop-color="#F3EBD9" />
      <stop offset="100%" stop-color="#DFD2BC" />
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFD2BC" />
      <stop offset="15%" stop-color="#F3EBD9" />
      <stop offset="100%" stop-color="#FAF6EE" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1A0906" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" />
  <rect x="34" y="34" width="444" height="444" rx="92" ry="92" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.55" />

  <!-- Subtle Radial Glow Behind Cross/Star -->
  <circle cx="256" cy="156" r="92" fill="#F7DF8B" fill-opacity="0.14" />
  <circle cx="256" cy="156" r="56" fill="#F7DF8B" fill-opacity="0.22" />

  <!-- Golden Cross / AI Sparkle Star Above Open Book -->
  <g filter="url(#dropShadow)">
    <path d="M256 64 L270 132 L336 146 L270 160 L256 228 L242 160 L176 146 L242 132 Z" fill="url(#goldGrad)" />
    <circle cx="256" cy="146" r="10" fill="#FFFDF8" />
    <!-- Secondary small sparkles -->
    <path d="M352 88 L356 102 L370 106 L356 110 L352 124 L348 110 L334 106 L348 102 Z" fill="#F7DF8B" opacity="0.85" />
    <path d="M160 88 L164 102 L178 106 L164 110 L160 124 L156 110 L142 106 L156 102 Z" fill="#F7DF8B" opacity="0.85" />
  </g>

  <!-- Open Bible Base Cover (Gold & Dark Leather Rim) -->
  <g filter="url(#dropShadow)">
    <path d="M88 236 C140 220, 212 228, 256 248 C300 228, 372 220, 424 236 L424 406 C372 390, 300 398, 256 418 C212 398, 140 390, 88 406 Z" fill="url(#goldGrad)" />

    <!-- Left Parchment Page -->
    <path d="M100 224 C148 208, 214 216, 256 238 L256 398 C214 378, 148 370, 100 386 Z" fill="url(#pageLeft)" />

    <!-- Right Parchment Page -->
    <path d="M256 238 C298 216, 364 208, 412 224 L412 386 C364 370, 298 378, 256 398 Z" fill="url(#pageRight)" />

    <!-- Left Page Scripture Lines -->
    <path d="M126 262 C162 252, 206 256, 234 268" stroke="#8C3B2E" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.55" />
    <path d="M126 292 C162 282, 206 286, 234 298" stroke="#6E625C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45" />
    <path d="M126 320 C162 310, 206 314, 234 326" stroke="#6E625C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45" />
    <path d="M126 348 C158 340, 194 342, 218 352" stroke="#6E625C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45" />

    <!-- Right Page Scripture Lines -->
    <path d="M278 268 C306 256, 350 252, 386 262" stroke="#8C3B2E" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.55" />
    <path d="M278 298 C306 286, 350 282, 386 292" stroke="#6E625C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45" />
    <path d="M278 326 C306 314, 350 310, 386 320" stroke="#6E625C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45" />
    <path d="M278 352 C302 342, 338 340, 368 348" stroke="#6E625C" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45" />

    <!-- Crimson Ribbon Bookmark -->
    <path d="M247 394 L265 394 L265 446 L256 435 L247 446 Z" fill="#C53B27" />
  </g>
</svg>
