name: bible_ai_app
description: "Bible AI — an offline-first Bible reader with AI study perspectives and audio."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: >=3.0.0 <4.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  http: ^1.6.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  intl: ^0.20.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bibles/en-kjv.json.gz
    - assets/data/catalog_fallback.json
    - assets/data/sample_interpretations.json
    - shared/perspectives.json
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
